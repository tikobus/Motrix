name: Build/release

on:
  push:
    branches: [ releases ]
    # Pushing a version tag (e.g. "v1.8.19") triggers a build AND publishes it
    tags: [ 'v*' ]

# electron-builder needs write access to create the GitHub Release and
# upload assets (tag builds only — see `--publish onTag` below).
permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    # Build on/for macOS (→ .dmg) and Windows (→ .exe)
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # Full history so electron-builder can resolve the tag and notes
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Compile main + renderer with webpack (does not invoke electron-builder)
      - name: Build app sources
        run: yarn run build:github

      # ------------------------------------------------------------------
      # Packaging & publishing
      #
      # `--publish onTag` is electron-builder's native publish mode: it only
      # uploads to GitHub Releases when the build was triggered by a version
      # tag (e.g. "v1.8.19"). Regular pushes and PRs build but skip publish.
      #
      # `GH_TOKEN` is what electron-builder reads to authenticate against the
      # GitHub Releases API (the auto-provided GITHUB_TOKEN works).
      # --------------------------------------------------------------------

      - name: Build & publish macOS (.dmg)
        if: startsWith(matrix.os, 'macos')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer credentials in CI → skip notarize. The
          # afterSign hook honors this flag and returns early.
          SKIP_NOTARIZE: 'true'
        run: yarn run electron-builder --mac dmg --publish onTag

      - name: Build & publish Windows (.exe)
        if: startsWith(matrix.os, 'windows')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Limit to `nsis` so we get the .exe installer. The repo also
        # declares an `appx` target which requires a code-signing
        # certificate; without it that target fails and would abort the
        # whole Windows job. Restricting the target keeps the build green.
        run: yarn run electron-builder --win nsis --publish onTag
